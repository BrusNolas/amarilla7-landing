<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amarilla 7 - Acceso Exclusivo</title>
  
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // Pixel ID Activo y PageView
    fbq('init', '1487854585605104');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1487854585605104&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Meta Pixel Code -->

  <!-- Script de Conversión para el Botón (Evento Subscribe) -->
  <script>
    function trackSubscribeAndGo(event) {
      event.preventDefault();
      var targetUrl = event.currentTarget.getAttribute('href');
      
      // Disparar evento Subscribe para Meta Ads
      if (typeof fbq === 'function') {
        fbq('track', 'Subscribe');
      }
      
      // Pausa de 400ms optimizada para celulares antes de redirigir a Telegram
      setTimeout(function() {
        window.location.href = targetUrl;
      }, 400);
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #2a2208 0%, #121212 70%);
      border: 2px solid #f5cf47;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(245, 207, 71, 0.3);
      position: relative;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    h1 {
      color: #f5cf47;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    p {
      color: #d1d1d1;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
      max-width: 380px;
    }

    .btn-telegram {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(180deg, #f0cf65 0%, #c49218 100%);
      color: #0d0d0d;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 18px 20px;
      border: none;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 8px 30px rgba(196, 146, 24, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-telegram:active {
      transform: scale(0.98);
      box-shadow: 0 4px 15px rgba(196, 146, 24, 0.3);
    }

    .footer-text {
      margin-top: 35px;
      color: #555555;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Amarilla 7" class="logo-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#f5cf47;font-size:48px;font-weight:900;\'>7</span>'">
    </div>

    <h1>AMARILLA 7</h1>
    
    <p>Expertos en estadísticas avanzadas de fútbol y análisis de alto valor. Ingresa ahora a nuestra comunidad exclusiva.</p>
    
    <a href="https://t.me/+xNmTvaBo92U2MGMx" class="btn-telegram" onclick="trackSubscribeAndGo(event)">
      🟡 UNIRME AL CANAL GRATIS DE TELEGRAM
    </a>

    <div class="footer-text">
      © 2026 Amarilla 7. Todos los derechos reservados.
    </div>
  </div>

</body>
</html>
