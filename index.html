    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

    // Tu Pixel activo de Meta Ads
  <script>
  function trackSubscribeAndGo(event) {
    event.preventDefault();
    var targetUrl = event.currentTarget.getAttribute('href');
    
    // Disparar evento de Suscripción activo en Meta Ads
    if (typeof fbq === 'function') {
      fbq('track', 'Subscribe');
    }
    
    // Pausa de 400ms para asegurar la señal en celular
    setTimeout(function() {
      window.location.href = targetUrl;
    }, 400);
  }
</script>
