  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #141414;
      border: 1px solid #282828;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    }

    .logo {
      width: 100px;
      height: auto;
      max-width: 100%;
      margin: 0 auto 16px auto;
      display: block;
      border-radius: 12px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 215, 0, 0.12);
      color: #ffd700;
      border: 1px solid rgba(255, 215, 0, 0.3);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    h1 {
      color: #ffd700;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    p {
      color: #cccccc;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn-telegram {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #ffd700 0%, #e6b800 100%);
      color: #000000;
      font-size: 17px;
      font-weight: 800;
      padding: 16px;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .btn-telegram:active {

    <a href="https://t.me/+xNmTvaBo92U2MGMx" class="btn-telegram" onclick="trackSubscribeAndGo(event)">
      👉 UNIRME AL CANAL AHORA
    </a>
  </div>

  <script>
    function trackSubscribeAndGo(event) {
      event.preventDefault();
      var targetUrl = event.currentTarget.getAttribute('href');
      
      // Registrar evento Subscribe (Suscripción en el sitio web)
      if (typeof fbq === 'function') {
        fbq('track', 'Subscribe');
      }
      
      // Pausa optimizada para celulares antes de redirigir
      setTimeout(function() {
        window.location.href = targetUrl;
      }, 400);
    }
  </script>

</body>
